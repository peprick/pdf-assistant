spring.application.name=pdf-rag-backend
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pdf_assistant}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pdf_assistant}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pdf_assistant}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

app.storage.upload-dir=${APP_STORAGE_UPLOAD_DIR:./data/uploads}
app.ollama.base-url=${APP_OLLAMA_BASE_URL:http://localhost:11434}
app.ollama.chat-model=${APP_OLLAMA_CHAT_MODEL:qwen3:8b}
app.ollama.embedding-model=${APP_OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
app.rag.chunk-size=${APP_RAG_CHUNK_SIZE:2200}
app.rag.chunk-overlap=${APP_RAG_CHUNK_OVERLAP:250}
app.rag.max-results=${APP_RAG_MAX_RESULTS:5}
app.rag.embedding-dimensions=${APP_RAG_EMBEDDING_DIMENSIONS:768}
