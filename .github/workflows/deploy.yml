name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw -B test package

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy to EC2
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/aws_key
          chmod 600 ~/.ssh/aws_key
          ssh-keyscan -H "${{ secrets.AWS_HOST }}" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/aws_key ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} "mkdir -p /tmp/pdf-assistant/frontend"

          scp -i ~/.ssh/aws_key backend/target/backend-0.0.1-SNAPSHOT.jar ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:/tmp/pdf-assistant/backend.jar
          scp -i ~/.ssh/aws_key -r frontend/dist/* ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:/tmp/pdf-assistant/frontend/

          ssh -i ~/.ssh/aws_key ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} "
            cp /tmp/pdf-assistant/backend.jar /opt/pdf-assistant/backend/backend.jar &&
            rm -rf /var/www/pdf-assistant/* &&
            cp -r /tmp/pdf-assistant/frontend/. /var/www/pdf-assistant/ &&
            sudo systemctl restart pdf-assistant
          "
